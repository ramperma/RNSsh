[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rnssh"
version = "0.1.0"
description = "SSH connection manager with automatic key provisioning and tmux sessions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RNSsh" }]
dependencies = [
    "PySide6>=6.6",
    "paramiko>=3.4",
    "cryptography>=42",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
rnssh = "rnssh.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rnssh = ["ui/*.qss", "ui/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
